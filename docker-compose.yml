services:

  # =========================================================
  # POSTGRESQL DATABASE
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - backend-net


  # =========================================================
  # CHAT APPLICATION
  # =========================================================
  chat-app:
    build:
      context: ./backend

    container_name: chat-app
    restart: unless-stopped

    environment:
      PORT: 3000

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

      SESSION_SECRET: ${SESSION_SECRET}

      NODE_ENV: production

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    networks:
      - frontend-net
      - backend-net
      - monitoring-net


  # =========================================================
  # NGINX REVERSE PROXY
  # =========================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    restart: unless-stopped

    depends_on:
      - chat-app

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    read_only: true

    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    security_opt:
      - no-new-privileges:true

    networks:
      - frontend-net
      - monitoring-net


  # =========================================================
  # PGADMIN
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: chat-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend-net
      - admin-net


  # =========================================================
  # PROMETHEUS
  # =========================================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: chat-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - monitoring-net


  # =========================================================
  # GRAFANA
  # =========================================================
  grafana:
    image: grafana/grafana:11.2.2
    container_name: chat-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana

      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

    depends_on:
      - prometheus
      - loki

    networks:
      - monitoring-net


  # =========================================================
  # LOKI
  # =========================================================
  loki:
    image: grafana/loki:3.1.1
    container_name: chat-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    ports:
      - "3100:3100"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    networks:
      - monitoring-net


  # =========================================================
  # PROMTAIL
  # =========================================================
  promtail:
    image: grafana/promtail:3.1.1
    container_name: chat-promtail
    restart: unless-stopped

    command:
      - "-config.file=/etc/promtail/config.yml"

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro

      # Đọc log Docker
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki

    networks:
      - monitoring-net


  # =========================================================
  # CADVISOR
  # =========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: chat-cadvisor
    restart: unless-stopped

    privileged: true

    ports:
      - "8080:8080"

    volumes:
      # Root filesystem
      - /:/rootfs:ro

      # Docker runtime
      - /var/run:/var/run:rw

      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # System metrics
      - /sys:/sys:ro

      # Docker data
      - /var/lib/docker:/var/lib/docker:ro

      # Disk metrics
      - /dev/disk:/dev/disk:ro

    devices:
      - /dev/kmsg:/dev/kmsg

    security_opt:
      - apparmor:unconfined

    networks:
      - monitoring-net

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/healthz"
        ]
      interval: 30s
      timeout: 10s
      retries: 5


  # =========================================================
  # POSTGRES EXPORTER
  # =========================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: chat-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "9187"

    networks:
      - backend-net
      - monitoring-net


  # =========================================================
  # NGINX EXPORTER
  # =========================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: chat-nginx-exporter
    restart: unless-stopped

    command:
      - "--nginx.scrape-uri=http://nginx/nginx_status"

    depends_on:
      - nginx

    expose:
      - "9113"

    networks:
      - frontend-net
      - monitoring-net


# =========================================================
# NETWORKS
# =========================================================
networks:

  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge
    internal: true

  monitoring-net:
    driver: bridge

  admin-net:
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================
volumes:

  postgres_data:

  pgadmin_data:

  prometheus_data:

  grafana_data:

  loki_data: